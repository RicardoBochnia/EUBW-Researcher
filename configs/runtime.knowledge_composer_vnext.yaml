{
  "logging": {
    "level": "INFO"
  },
  "retrieval": {
    "top_k": 5,
    "lexical_weight": 0.6,
    "semantic_weight": 0.4,
    "min_combined_score": 0.05,
    "local_retrieval_backend": "scan",
    "local_index_candidate_pool": 10,
    "web_timeout_seconds": 10,
    "web_discovery_max_depth": 1,
    "web_discovery_max_pages": 12,
    "web_discovery_max_candidates_per_kind": 5,
    "web_max_admitted_per_domain": 10,
    "web_max_admitted_per_run": 25,
    "semantic_expansions": {
      "authorization": ["authorisation", "authz"],
      "server": ["as"],
      "presentation": ["verifiable", "vp"],
      "credential": ["issuance", "vci"],
      "openid4vci": ["credential", "issuance"],
      "openid4vp": ["presentation", "verifier"]
    }
  },
  "knowledge_service": {
    "enabled": true,
    "emit_clusters": true,
    "discovery_mode": "assistive",
    "strict_verification_required": true,
    "legacy_assets_root": "artifacts/knowledge/imported_legacy",
    "max_candidate_claim_targets": 8,
    "reading_loop": {
      "enabled": true,
      "max_clusters": 5,
      "max_opened_passages": 10,
      "max_adjacent_passages_per_cluster": 1,
      "timeout_seconds": 30
    }
  },
  "answer_composer": {
    "mode": "vnext"
  }
}
